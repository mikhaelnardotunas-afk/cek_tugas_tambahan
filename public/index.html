<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ujian Praktikum Matematika — Layar Siswa</title>
<link rel="stylesheet" href="/css/siswa.css">
</head>
<body>
<div id="sky">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="floaty f1">+</div><div class="floaty f2">÷</div><div class="floaty f3">×</div>
  <div class="floaty f4">π</div><div class="floaty f5">√</div><div class="floaty f6">=</div>
  <div class="hill h1"></div><div class="hill h2"></div>
</div>

<main id="app"></main>

<div id="netbad" class="hidden">⚠️ Koneksi ke laptop guru terputus… mencoba lagi</div>
<button id="fsbtn" title="Layar penuh">⛶</button>

<!-- Layar pembuka: diperlukan agar suara & layar penuh aktif -->
<div id="tapstart">
  <div class="tapcard">
    <div class="mascot big" data-mood="happy"></div>
    <h1>Ujian Praktikum<br>Matematika</h1>
    <p>Ketuk layar untuk memulai</p>
    <div class="tapbtn">👆 KETUK DI SINI</div>
  </div>
</div>

<canvas id="confetti"></canvas>
<script src="/js/common.js"></script>
<script src="/js/siswa.js"></script>
</body>
</html>
